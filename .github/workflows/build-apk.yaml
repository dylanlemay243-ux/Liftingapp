name: Build Android APK

# Runs on every push to main, and can be triggered manually from the Actions tab
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # needed so the workflow can create a Release with the APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform (generates native project)
        run: npx cap add android

      - name: Copy web assets into the Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk dylans-training-app.apk

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dylans-training-app-apk
          path: dylans-training-app.apk

      - name: Publish APK to a Release (easy to download on your phone)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Unique tag: run number + short commit sha, so it never collides
          TAG="build-${{ github.run_number }}-${GITHUB_SHA::7}"
          # If a release/tag with this name somehow exists, delete it first
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dylans-training-app.apk \
            --title "Dylan's Training App — build ${{ github.run_number }}" \
            --notes "Auto-built debug APK. Download dylans-training-app.apk below and open it on your Android phone to install."

      - name: Update 'latest' release (always points to newest build)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A stable 'latest' release you can always bookmark for the newest APK
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dylans-training-app.apk \
            --title "Dylan's Training App — latest" \
            --notes "Always the newest build. Download dylans-training-app.apk below."
