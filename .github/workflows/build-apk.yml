name: Build Android APK

# Runs on every push to main, and can be triggered manually from the Actions tab
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # needed so the workflow can create a Release with the APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform (generates native project)
        run: npx cap add android

      - name: Copy web assets into the Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk vert-jump.apk

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vert-jump-apk
          path: vert-jump.apk

      - name: Publish APK to a Release (easy to download on your phone)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" vert-jump.apk \
            --title "Vert Jump — build ${{ github.run_number }}" \
            --notes "Auto-built debug APK. Download vert-jump.apk below and open it on your Android phone to install."
